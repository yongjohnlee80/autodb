# autodb configuration — EXAMPLE
#
# Copy to the location autodb reads, then edit:
#
#   mkdir -p ~/.config/autodb
#   cp config.example.toml ~/.config/autodb/config.toml
#
# or point a run at any file: `autodb --serve --config /path/to/config.toml`
# (pass the same --config to `autodb --ui`, which hands it to the server it
# spawns).
#
# The file is OPTIONAL. Every value below is autodb's default, so an
# absent config and this file (uncommented) behave identically — nothing
# here is required to run.
#
# Two things to know before editing:
#
#   * Unknown keys are REJECTED, not ignored. A typo fails at startup
#     with the offending key named, rather than silently leaving you on a
#     default you thought you had changed.
#   * Validation happens at load: a bad port, bind address, CIDR, or a
#     postgres meta store with no DSN stops the server before it listens.

[server]
# By DEFAULT autodb listens on a local unix socket — no port, no network
# stack, unreachable from another machine, and openable only by your own
# user because the socket file is mode 0600. Frontends (the TUI and
# autovim's Lua integration) find each other there, and the first one to
# see nothing listening starts a server. This default is for SINGLE-USER
# use: another OS account on the same machine cannot open the socket
# (the daemon re-applies 0600 on every bind, so a manual chmod to a
# group-owned socket lasts only until the next restart). For a MULTI-USER
# host — one daemon, several people with their own SSH accounts — the
# preferred setup is to set a loopback port below: every local account can
# then log in with their own autodb credentials, mint a PAT and whitelist
# their IPs. Each person is identified by their autodb login, not their
# OS user.
#
# Setting a port is how you OPT IN to TCP for remote access. Do it
# deliberately: autodb holds encrypted database credentials for every
# user, so reaching it across a network is a decision you make, never one
# you inherit from a default. Tighten [security].ip_allowlist to match,
# and put the port behind whatever your network already trusts.
# (Remote access is M9-gated pending TLS and rate limits.)
# port = 7419

# TCP listen address. Only consulted when `port` is set above.
bind = "127.0.0.1"

# Override the unix socket path. Empty means a per-user runtime
# directory: $XDG_RUNTIME_DIR/autodb.sock on Linux, and $TMPDIR (which
# is per-user and 0700) on macOS. Set this if you need a specific
# location — keep it under ~100 bytes, which is the kernel's limit for a
# socket path.
# socket = "/run/user/1000/autodb.sock"

[meta]
# autodb's OWN database: users, encrypted connection secrets, grants,
# workspaces, sessions, the audit log, and script history. It is not one
# of the databases you connect TO.
#
# "sqlite" (default) or "postgres". Postgres is for installations with
# many users and long script retention; migration from sqlite is
# supported and ONE-WAY.
engine = "sqlite"

# postgres only. The meta store holds the audit trail, the user records and
# the ENCRYPTED CONNECTION SECRETS, so its transport is checked at startup:
# sslmode=verify-full with an explicit sslrootcert, or autodb refuses to
# start (ADR-0079 §4).
#
#   dsn = "postgres://autodb@db.internal/autodb?sslmode=verify-full&sslrootcert=/etc/ssl/certs/db-ca.crt"
#
# `require` is NOT sufficient and the difference is not pedantry: it encrypts
# but authenticates NOTHING — any certificate from anything answering on that
# address is accepted, so an attacker who can redirect the connection reads
# and rewrites the whole store. `verify-ca` proves the issuer but not that the
# certificate belongs to the host you asked for. Only `verify-full` checks
# both. An absent sslmode is not "unspecified": libpq defaults to `prefer`,
# which silently falls back to plaintext.
#
# Set this only if postgres is genuinely reached over a trusted local channel
# (a unix socket, or loopback on the same host). It is a named key so that an
# insecure deployment is visible to whoever reads this file.
allow_insecure_dsn = false

# postgres only. Bounds the META store's own pool; 0 takes the built-in
# default (8). This is NOT the target-pool number from [exec]: that one is
# sized by how much USER traffic a target absorbs, while this pool serves the
# daemon's own bookkeeping, whose concurrency the daemon sets. It may not be
# set below 2 — the instance lease pins one connection for the daemon's
# lifetime, so a pool of 1 leaves nothing for the work beside it.
pool_max_conns = 0

# sqlite only. Empty means $XDG_DATA_HOME/autodb/meta.db
# (~/.local/share/autodb/meta.db). The -wal and -shm files beside it are
# part of the database: copy all three together, or checkpoint first.
#
# Losing this file means losing your users, grants and stored
# connections — the encrypted DSNs are unrecoverable without it, because
# the master key lives in its keyslot envelope. Back it up like a
# credential store, because that is what it is.
# path = "/home/you/.local/share/autodb/meta.db"

# postgres only, and REQUIRED when engine = "postgres".
# dsn = "postgres://autodb:secret@localhost:5432/autodb"

[history]
# Record every executed script (who, when, from which IP, against which
# connection, how it ended) for recall in the TUI's SPC H view.
#
# Turning this off does NOT turn off auditing: the audit log is always
# on and records the attempt before it runs. This switch only controls
# whether the script TEXT is kept for recall.
enabled = true

[security]
# Client CIDRs allowed to reach the server. Enforced at login, so a
# stolen token is useless from an address outside this list.
#
# Loopback only by default. Widen it deliberately and narrowly — this is
# the guard that makes a shared autodb a gate in front of your databases
# rather than a hole through them.
ip_allowlist = ["127.0.0.1/32", "::1/128"]

# Example for a trusted internal subnet, ADDED to loopback rather than
# replacing it (the TUI on this machine still connects over loopback):
# ip_allowlist = ["127.0.0.1/32", "::1/128", "10.0.5.0/24"]

[exec]
# The largest single statement the engine will execute, in bytes.
#
# A refusal boundary, not a performance knob: an oversized statement is
# refused BEFORE it runs, so nothing executes that the engine declined to
# consider.
#
# It does not bound what is STORED. The audit and history record keeps a
# 8 KiB prefix whatever this is set to, so a statement larger than that is
# recorded in part — every execution still leaves a durable attempt record,
# but the record is not a full copy of the text.
#
# 64 KiB by default. The previous 8 KiB was too small for real schema work
# — a production deployment corpus of 470 scripts held statements up to
# 11.6 KiB, all of them ordinary view definitions. Raise it if your
# migrations are larger; the audit truncation is separate and deliberately
# stays small, because letting bigger statements RUN is not a reason to store
# more of each one.
max_statement_bytes = 65536

# How many ExecSessions may be open at once, per user and in total.
#
# One transaction per session bounds how many database connections can be
# pinned, but not the session objects and their timers — without these an
# authenticated caller could exhaust memory inside the idle window below just
# by opening sessions and walking away.
#
# An explicit 0 is a CONFIGURATION ERROR, not "unlimited". A default
# deployment is always bounded, and unbounded is not something you should be
# able to get by accident. Remove the key to take the default.
max_sessions_per_user = 8
max_sessions_global = 256

# Close a session that has no open transaction and has run no statement for
# this long. This is what reaps sessions a crashed client never closed —
# every close is audited.
session_idle_timeout = "30m"

# Bounds on an OPEN transaction.
#
# These are not tuning knobs with a sensible "off". The target may be a live
# production database, and a transaction abandoned between BEGIN and COMMIT
# holds its locks until something ends it — nothing else will. 90 seconds of
# idle is a person thinking between two statements; five minutes is the
# outside edge of a deliberate piece of work. Both roll back automatically and
# both are audited with which limit fired.
idle_in_tx_timeout = "90s"
max_tx_duration = "5m"

# The idle bound for connections marked debug: a developer paused at a
# breakpoint inside a transaction should not be rolled back mid-step. Longer,
# still bounded, still under the ceiling below.
debug_idle_in_tx_timeout = "10m"

# The install-wide maximum a per-connection override may reach. Without it a
# connection row could raise its own limit past whatever you decided here, and
# the production-safety bound would be advisory.
max_tx_duration_ceiling = "30m"

# How many connections one TARGET pool may open. A pinned transaction holds a
# physical connection for as long as its session keeps it open, so without a
# bound a few callers with open transactions can consume a production
# database's whole connection budget — and what fails first is somebody else's
# application, not autodb.
#
# A connection row may ask for FEWER; it can never ask for more. This number is
# a ceiling, and a row able to raise it would make the bound advisory.
# Left unset on purpose: the default is 2 x cores (ADR-0074 1a), which depends
# on the machine, so there is no literal that is right everywhere. pgxpool's
# own default is roughly core-count, and pinned transaction connections
# exhaust exactly that -- a session holding a transaction occupies a physical
# connection for as long as it stays open.
#
# Raise it by the ADR's sizing rule: pool_max_conns >= concurrent tx-holders
# (at most your team size, since it is one transaction per session) plus
# statement headroom -- about 25 for a ten-developer team -- bounded by the
# production max_connections budget for autodb's role.
#
# pool_max_conns = 32

# When pooled connections are retired. Idle time returns budget to the target
# between bursts; lifetime bounds how long a physical connection persists at
# all, which is what makes a server-side change — a rotated credential, a
# restarted primary — take effect without restarting the daemon.
pool_max_conn_idle_time = "10m"
pool_max_conn_lifetime = "60m"

# How often the engine sweeps for expired transactions and idle sessions. This
# bounds how far past its deadline an abandoned transaction can keep holding
# locks, so it must stay well under idle_in_tx_timeout — it is a fraction of
# the shortest bound, not a tuning preference.
janitor_interval = "10s"

# How often the engine re-asks targets about transactions whose outcome it
# could not determine — a commit that was in flight when the process died, or
# one the driver could not prove either way (ADR-0074 §7).
#
# Deliberately much longer than janitor_interval. That one bounds how long an
# abandoned transaction holds LOCKS, which is a live cost paid by every other
# client; this one bounds how long an already-finished transaction's outcome
# stays unknown, which blocks nobody. A pass may open a connection to every
# target that has a pending entry, so sweeping as often as the janitor would
# turn an unreachable database into steady connection pressure against it.
#
# The pass that recovers the crash window runs once at STARTUP regardless of
# this value; the interval only governs entries whose target was unreachable
# at that moment.
#
# Set to "0s" (or any non-positive value) to DISABLE the periodic pass. That
# is a supported choice, not a misconfiguration: startup recovery and
# connection-checkout reconciliation still run, so a pending entry is resolved
# the next time its target is used. What you give up is the timed retry for a
# target nothing else touches.
reconcile_interval = "1m"

# How long a SETTLED transaction keeps its full progression before it is
# collapsed to a tombstone, and how often that pass runs (ADR-0079 §3).
#
# DISABLED by default — outcome_retention = "0s" means never collapse. Turn it
# on only when the outcome log is actually large; at one row per transition it
# is far smaller than script_history or audit_log.
#
# Retention here NEVER deletes a transaction. It prunes the intermediate
# transitions and keeps the terminal as a tombstone, because `ErrNoSuchTx`
# means "no transaction was started" — deleting a settled transaction would
# make a committed one start answering "no such transaction". For the same
# reason the outcome log is never time-partitioned: detaching a partition is
# deletion with extra steps.
outcome_retention = "0s"
outcome_retention_interval = "1h"

[tui]
# Where `autodb --ui` keeps its local .sql notes. Empty means
# $XDG_DATA_HOME/autodb/notes (~/.local/share/autodb/notes).
#
# Notes are CLIENT-side files, grouped per workspace by immutable
# workspace id — renaming a workspace never moves them, and deleting one
# server-side never deletes your files (they surface as "detached notes"
# in the explorer instead). Point this at a directory you already sync or
# keep in version control if you want your query scratchpads to travel.
# notes_dir = "/home/you/Documents/autodb-notes"

[web]
# The --web-ui gateway (ADR-0064). These keys are ignored by --serve and --ui.
#
# Which note tree a browser session reads.
#
# "per-user" (default) gives each browser identity its own root,
# <notes_dir>/u-<subject>. That is the safe shape for a gateway, because one
# process serves N people and a NoteStore reads from disk, which has no
# identity: a shared root would hand every web user everyone else's notes.
#
# "workspace" reads the SHARED workspace-keyed tree the terminal TUI writes,
# <notes_dir>/ws-<id>. This exists for the common case that is NOT multi-user:
# one person, one machine, opening the same install through two frontends.
# Showing them an empty directory while their own notes sit one level up is a
# lost file, not isolation.
#
# It is opt-in and identity-BOUND, never inferred. Counting logged-in users is
# not a safe test for "only one person" — the first user can open the shared
# root before a second ever logs in — so workspace mode requires the subject
# below and REFUSES every other identity, before any session or note store is
# built for them.

# The single identity permitted in workspace mode. REQUIRED there: a missing
# value is a startup error, not a quiet fall back to per-user, because
# silently narrowing a mode the operator asked for is how a config mistake
# turns into a data-exposure surprise. Must match the daemon's own name for
# the user (what `auth.login` reports), not merely what gets typed in the
# browser form.

[frontdoor]
# The PostgreSQL wire-protocol front door (ADR-0075): a TCP listener that
# speaks pgwire v3, so ordinary PostgreSQL clients -- psql, pgx, lib/pq, a
# JetBrains data source -- reach an autodb connection directly, through the
# same gate stack as every other surface.
#
# OFF unless you turn it on. This surface speaks a protocol every client in
# the world already knows how to dial, so switching it on is the decision.
enabled = false

# TCP only. The unix-socket LocalPeer exemption does NOT apply here -- a
# front-door caller always authenticates. Loopback by default; exposing it is
# something you write down.
bind = "127.0.0.1:5432"

# The server's TLS identity. BOTH are required when enabled = true, and both
# are validated BEFORE the listener binds: an absent, unparsable, expired,
# not-yet-valid, wrongly-chained or mismatched key/cert fails startup. The
# front door never listens with an identity it cannot prove.
#
# Clients are expected to use sslmode=verify-full. `require` authenticates
# nothing and permits an active MITM to collect access tokens in cleartext,
# which is the whole reason this listener refuses to start without a real
# certificate.
# tls_cert_file = "/etc/autodb/tls/fullchain.pem"
# tls_key_file = "/etc/autodb/tls/privkey.pem"

# The DNS names clients will dial, checked against the certificate at startup.
# REQUIRED when enabled = true, and at least one: verify-full verifies the
# NAME, so a certificate that is otherwise perfect but misses the name in your
# DSN fails at every client, one connection at a time, with an error that
# reads like a client problem. Checking it once here turns that into a message
# at the moment you made the mistake.
#
# Not inferred from `bind` on purpose: bind is where the socket listens (often
# 0.0.0.0 or a private address), while this is the routable name in a DSN.
# Guessing one from the other would produce a check that passes while proving
# nothing about what clients actually dial.
# tls_host_names = ["autodb.example.com"]

# The trust root your OWN certificate chain is verified against at startup.
# Empty uses this host's system roots, which is right for a public ACME
# certificate. Point it at your CA bundle if the certificate comes from a
# private CA, so the chain can be verified without installing that CA
# host-wide for the benefit of one process.
#
# The whole chain is verified here, not just the leaf: a certificate served
# without its intermediate parses fine, is in date and carries the right name,
# but cannot be built into a path to any root -- so every verifying client
# rejects it and the listener is the last to know. That is what a renewal
# writing cert.pem where fullchain.pem was meant looks like.
# tls_root_ca_file = "/etc/autodb/tls/ca.pem"

# ---------------------------------------------------------------------------
# TURNING TLS OFF, FOR DEBUGGING ONLY.
#
# This is the one setting on this surface that WEAKENS a ratified security
# property, so read the whole comment before you set it.
#
# WHAT IT COSTS: with TLS off, EVERY ACCESS TOKEN CROSSES THE WIRE IN
# CLEARTEXT. A token works from anywhere it is admitted until it is revoked, so
# an intercepted one is a credential an attacker keeps -- not a session they
# have to re-establish. ADR-0075 chose sslmode=verify-full over `require`
# precisely because an unauthenticated channel lets an active MITM collect
# tokens, and this is a deliberate, documented exception for debugging rather
# than a reversal of that decision.
#
# It is a SENTENCE, not a flag, and the only accepted value is the one below.
# `true` is refused. That is on purpose: a boolean is copy-pasteable from a blog
# post and reads as ordinary configuration, while a sentence stating the
# consequence cannot be set absent-mindedly or inherited from an example nobody
# read. Any other value fails config load rather than being ignored.
#
# WHAT BOUNDS IT is not the bind address -- a non-loopback bind is permitted,
# and the administrator owns that deployment decision. What bounds it is that a
# cleartext listener accepts ONLY tokens minted for it (`debug_cleartext`),
# whose own allowed_ips list is then their entire admission gate, and which are
# REFUSED on a TLS listener. Such a token can only be minted by an admin, and
# only while this mode is actually running -- so tokens cannot accumulate on a
# TLS-only install and all wake up the day someone turns this on.
#
# When it is set, cert/key/host names below are not required: there is no
# identity to prove.
# insecure_disable_tls = "i-accept-that-every-pat-crosses-in-cleartext"

# ---------------------------------------------------------------------------
# GETTING A CERTIFICATE -- the short way.
#
#   autodb --create-cert
#
# It reads tls_host_names above, writes ca.pem / cert.pem / key.pem into a
# tls/ directory beside this config, and prints the block to paste back here
# plus the DSN to hand a developer. Then:
#
#   autodb --create-cert --export-ca     # print ca.pem again, for a new hire
#   autodb --create-cert --leaf-only     # renew, or add an address, keeping
#                                        # the SAME ca.pem everyone holds
#
# GIVE DEVELOPERS ONE FILE: ca.pem. It is public -- commit it internally, paste
# it in chat. key.pem NEVER leaves this host: anybody holding it can impersonate
# this front door and collect other developers' tokens, which is the exact
# attack mandatory TLS prevents, arriving through the filesystem instead of the
# network.
#
# WHY IT IS SAFER THAN mkcert, which is the obvious alternative: mkcert installs
# an UNCONSTRAINED CA into your machine trust store -- one that can mint a valid
# certificate for any domain on the internet, for as long as it is installed.
# autodb's CA is never installed machine-wide and carries X.509 name
# constraints, so it cannot sign anything outside the names above even if this
# host is compromised.
#
# IT WORKS WITHOUT A DNS NAME. Put the address in tls_host_names and the
# certificate carries it as an IP SAN. Verified against the three stacks a
# client here can be using -- libpq/psql, pgjdbc (which is what DataGrip runs)
# and Go -- each with a control proving the check was actually running. Use a
# RESERVED static address: an ephemeral one changes on stop/start and the
# certificate would have to be reissued.
#
# NOT the production path for a public deployment: prefer a real ACME
# certificate. This is for development and internal hosts.
#
# ---------------------------------------------------------------------------
# GETTING A CERTIFICATE the other way, with mkcert.
#
# Kept because it is what most people reach for first, and because the three
# things that bite are worth knowing whichever route you take.
#
#   mkcert -install                  # once per machine: creates a local CA
#   mkcert localhost 127.0.0.1 ::1   # the cert and key, with matching SANs
#
# Three things bite, each of which has cost someone an hour:
#
#  1. verify-full verifies the NAME IN THE DSN, so every name a developer might
#     dial must be a SAN on the certificate. `localhost` and `127.0.0.1` are
#     DIFFERENT entries -- mkcert includes only what you list, and a DSN using
#     the one you omitted fails at the client with an error that reads like a
#     client problem.
#  2. `mkcert -install` does NOT reach psql or JetBrains. It installs the CA
#     into the OS and browser trust stores; libpq reads ~/.postgresql/root.crt
#     and pgjdbc uses a Java truststore or an explicit sslrootcert. So the
#     client still needs the CA named:
#       ...?sslmode=verify-full&sslrootcert=$(mkcert -CAROOT)/rootCA.pem
#  3. rootCA-key.pem is a real credential -- it can mint a certificate for any
#     name that machine trusts. It stays on the machine that generated it and
#     is never shared or committed.
#
# For a TEAM rather than one machine, the shape that scales is an internal CA
# (step-ca runs ACME, so developers get short-lived certificates automatically
# and the root is distributed once). "Everyone runs mkcert" works for a handful
# of developers and becomes an unmanaged CA per laptop beyond that.
#
# Only ca.pem -- the CA CERTIFICATE -- is given to developers. It is not a
# secret. The KEY never leaves the host: anyone holding it can impersonate this
# front door and collect other people's tokens.

# How many connections of each target pool are held back from wire leases,
# for the interactive surfaces and the engine's own control queries. Without
# it the front door can take the whole pool and the TUI stops working, with
# the front door looking healthy -- because from its side nothing failed.
reserved_headroom = 4

# Concurrent wire sessions per target pool. Unset derives
# pool_max_conns - reserved_headroom, which is what you almost always want.
# An explicit value may only be LOWER: a higher one promises leases the pool
# cannot supply, and that failure lands on whichever session asked last
# rather than on the person who set the number.
# max_leases = 6

# --- front-door budgets (ADR-0075 §4 and the protocol matrix §9) ---
#
# Everything below has a default that is the number the matrix pins. They are
# here because an operator with an unusual deployment shape needs to move one,
# not because they are routinely tuned. The listener validates the
# RELATIONSHIPS between them before it binds, so a set that cannot work fails
# start rather than at whichever connection arrives last.

# The memory open wire sessions may reserve in total. Row 2.7 charges a fixed
# figure per session against this when it admits one, so it is the bound on
# how much an authenticated population can hold at once.
#
# Until this was wired it was never set outside a test, which meant zero --
# and zero means no bound at all.
# resident_budget_bytes = 1073741824   # 1 GiB (ceiling 4 GiB; above it fails start)

# Live front-door connections, authenticated or not. This also sizes the
# control lane below.
# max_conns = 320

# Connections that have NOT yet authenticated. Much smaller than max_conns on
# purpose: an anonymous peer should command the smallest slice of the system,
# and a flood of half-open connections must not starve the authenticated ones
# out of their slots. The slot is returned AT authentication, not at close.
# pre_auth_conns = 64

# Concurrent credential verifications. Distinct from pre_auth_conns and not
# implied by it: verifying is the expensive part -- a token digest is
# deliberately slow and the chain behind it runs several queries -- so without
# this, every pre-auth connection could command one at once.
# auth_workers = 16

# FAILED authentications per minute from one source address, after which that
# address is refused at accept. Failures only: counting successes would cap
# every connection pool in your estate at ten connections a minute from one
# host, which is an outage rather than a defence. TLS handshake failures count
# too, so an attacker cannot switch from one kind of grinding to the other.
#
# May only be RAISED. Raise it if many clients share one egress address -- a
# NAT gateway, a Kubernetes egress IP -- because they share this budget.
# auth_failures_per_ip = 10

# The reserved control lane: memory held back so the messages that RELEASE the
# general budget -- Terminate, Sync, an error response -- can still be
# processed while it is saturated. Derived as max_conns x 64 KiB when unset,
# and it may only be raised above that.
# control_lane_bytes = 20971520        # 320 x 64 KiB
