# autodb configuration — EXAMPLE
#
# Copy to the location autodb reads, then edit:
#
#   mkdir -p ~/.config/autodb
#   cp config.example.toml ~/.config/autodb/config.toml
#
# or point a run at any file: `autodb --serve --config /path/to/config.toml`
# (pass the same --config to `autodb --ui`, which hands it to the server it
# spawns).
#
# The file is OPTIONAL. Every value below is autodb's default, so an
# absent config and this file (uncommented) behave identically — nothing
# here is required to run.
#
# Two things to know before editing:
#
#   * Unknown keys are REJECTED, not ignored. A typo fails at startup
#     with the offending key named, rather than silently leaving you on a
#     default you thought you had changed.
#   * Validation happens at load: a bad port, bind address, CIDR, or a
#     postgres meta store with no DSN stops the server before it listens.

[server]
# By DEFAULT autodb listens on a local unix socket — no port, no network
# stack, unreachable from another machine, and openable only by your own
# user because the socket file is mode 0600. Frontends (the TUI and
# autovim's Lua integration) find each other there, and the first one to
# see nothing listening starts a server.
#
# Setting a port is how you OPT IN to TCP for remote access. Do it
# deliberately: autodb holds encrypted database credentials for every
# user, so reaching it across a network is a decision you make, never one
# you inherit from a default. Tighten [security].ip_allowlist to match,
# and put the port behind whatever your network already trusts.
# (Remote access is M9-gated pending TLS and rate limits.)
# port = 7419

# TCP listen address. Only consulted when `port` is set above.
bind = "127.0.0.1"

# Override the unix socket path. Empty means a per-user runtime
# directory: $XDG_RUNTIME_DIR/autodb.sock on Linux, and $TMPDIR (which
# is per-user and 0700) on macOS. Set this if you need a specific
# location — keep it under ~100 bytes, which is the kernel's limit for a
# socket path.
# socket = "/run/user/1000/autodb.sock"

[meta]
# autodb's OWN database: users, encrypted connection secrets, grants,
# workspaces, sessions, the audit log, and script history. It is not one
# of the databases you connect TO.
#
# "sqlite" (default) or "postgres". Postgres is for installations with
# many users and long script retention; migration from sqlite is
# supported and ONE-WAY.
engine = "sqlite"

# sqlite only. Empty means $XDG_DATA_HOME/autodb/meta.db
# (~/.local/share/autodb/meta.db). The -wal and -shm files beside it are
# part of the database: copy all three together, or checkpoint first.
#
# Losing this file means losing your users, grants and stored
# connections — the encrypted DSNs are unrecoverable without it, because
# the master key lives in its keyslot envelope. Back it up like a
# credential store, because that is what it is.
# path = "/home/you/.local/share/autodb/meta.db"

# postgres only, and REQUIRED when engine = "postgres".
# dsn = "postgres://autodb:secret@localhost:5432/autodb"

[history]
# Record every executed script (who, when, from which IP, against which
# connection, how it ended) for recall in the TUI's SPC H view.
#
# Turning this off does NOT turn off auditing: the audit log is always
# on and records the attempt before it runs. This switch only controls
# whether the script TEXT is kept for recall.
enabled = true

[security]
# Client CIDRs allowed to reach the server. Enforced at login, so a
# stolen token is useless from an address outside this list.
#
# Loopback only by default. Widen it deliberately and narrowly — this is
# the guard that makes a shared autodb a gate in front of your databases
# rather than a hole through them.
ip_allowlist = ["127.0.0.1/32", "::1/128"]

# Example for a trusted internal subnet, ADDED to loopback rather than
# replacing it (the TUI on this machine still connects over loopback):
# ip_allowlist = ["127.0.0.1/32", "::1/128", "10.0.5.0/24"]

[exec]
# The largest single statement the engine will execute, in bytes.
#
# A refusal boundary, not a performance knob: an oversized statement is
# refused BEFORE it runs, so nothing executes that the engine declined to
# consider.
#
# It does not bound what is STORED. The audit and history record keeps a
# 8 KiB prefix whatever this is set to, so a statement larger than that is
# recorded in part — every execution still leaves a durable attempt record,
# but the record is not a full copy of the text.
#
# 64 KiB by default. The previous 8 KiB was too small for real schema work
# — a production deployment corpus of 470 scripts held statements up to
# 11.6 KiB, all of them ordinary view definitions. Raise it if your
# migrations are larger; the audit truncation is separate and deliberately
# stays small, because letting bigger statements RUN is not a reason to store
# more of each one.
max_statement_bytes = 65536

# How many ExecSessions may be open at once, per user and in total.
#
# One transaction per session bounds how many database connections can be
# pinned, but not the session objects and their timers — without these an
# authenticated caller could exhaust memory inside the idle window below just
# by opening sessions and walking away.
#
# An explicit 0 is a CONFIGURATION ERROR, not "unlimited". A default
# deployment is always bounded, and unbounded is not something you should be
# able to get by accident. Remove the key to take the default.
max_sessions_per_user = 8
max_sessions_global = 256

# Close a session that has no open transaction and has run no statement for
# this long. This is what reaps sessions a crashed client never closed —
# every close is audited.
session_idle_timeout = "30m"

# Bounds on an OPEN transaction.
#
# These are not tuning knobs with a sensible "off". The target may be a live
# production database, and a transaction abandoned between BEGIN and COMMIT
# holds its locks until something ends it — nothing else will. 90 seconds of
# idle is a person thinking between two statements; five minutes is the
# outside edge of a deliberate piece of work. Both roll back automatically and
# both are audited with which limit fired.
idle_in_tx_timeout = "90s"
max_tx_duration = "5m"

# The idle bound for connections marked debug: a developer paused at a
# breakpoint inside a transaction should not be rolled back mid-step. Longer,
# still bounded, still under the ceiling below.
debug_idle_in_tx_timeout = "10m"

# The install-wide maximum a per-connection override may reach. Without it a
# connection row could raise its own limit past whatever you decided here, and
# the production-safety bound would be advisory.
max_tx_duration_ceiling = "30m"

# How many connections one TARGET pool may open. A pinned transaction holds a
# physical connection for as long as its session keeps it open, so without a
# bound a few callers with open transactions can consume a production
# database's whole connection budget — and what fails first is somebody else's
# application, not autodb.
#
# A connection row may ask for FEWER; it can never ask for more. This number is
# a ceiling, and a row able to raise it would make the bound advisory.
# Left unset on purpose: the default is 2 x cores (ADR-0074 1a), which depends
# on the machine, so there is no literal that is right everywhere. pgxpool's
# own default is roughly core-count, and pinned transaction connections
# exhaust exactly that -- a session holding a transaction occupies a physical
# connection for as long as it stays open.
#
# Raise it by the ADR's sizing rule: pool_max_conns >= concurrent tx-holders
# (at most your team size, since it is one transaction per session) plus
# statement headroom -- about 25 for a ten-developer team -- bounded by the
# production max_connections budget for autodb's role.
#
# pool_max_conns = 32

# When pooled connections are retired. Idle time returns budget to the target
# between bursts; lifetime bounds how long a physical connection persists at
# all, which is what makes a server-side change — a rotated credential, a
# restarted primary — take effect without restarting the daemon.
pool_max_conn_idle_time = "10m"
pool_max_conn_lifetime = "60m"

# How often the engine sweeps for expired transactions and idle sessions. This
# bounds how far past its deadline an abandoned transaction can keep holding
# locks, so it must stay well under idle_in_tx_timeout — it is a fraction of
# the shortest bound, not a tuning preference.
janitor_interval = "10s"

# How often the engine re-asks targets about transactions whose outcome it
# could not determine — a commit that was in flight when the process died, or
# one the driver could not prove either way (ADR-0074 §7).
#
# Deliberately much longer than janitor_interval. That one bounds how long an
# abandoned transaction holds LOCKS, which is a live cost paid by every other
# client; this one bounds how long an already-finished transaction's outcome
# stays unknown, which blocks nobody. A pass may open a connection to every
# target that has a pending entry, so sweeping as often as the janitor would
# turn an unreachable database into steady connection pressure against it.
#
# The pass that recovers the crash window runs once at STARTUP regardless of
# this value; the interval only governs entries whose target was unreachable
# at that moment.
#
# Set to "0s" (or any non-positive value) to DISABLE the periodic pass. That
# is a supported choice, not a misconfiguration: startup recovery and
# connection-checkout reconciliation still run, so a pending entry is resolved
# the next time its target is used. What you give up is the timed retry for a
# target nothing else touches.
reconcile_interval = "1m"

[tui]
# Where `autodb --ui` keeps its local .sql notes. Empty means
# $XDG_DATA_HOME/autodb/notes (~/.local/share/autodb/notes).
#
# Notes are CLIENT-side files, grouped per workspace by immutable
# workspace id — renaming a workspace never moves them, and deleting one
# server-side never deletes your files (they surface as "detached notes"
# in the explorer instead). Point this at a directory you already sync or
# keep in version control if you want your query scratchpads to travel.
# notes_dir = "/home/you/Documents/autodb-notes"

[web]
# The --web-ui gateway (ADR-0064). These keys are ignored by --serve and --ui.
#
# Which note tree a browser session reads.
#
# "per-user" (default) gives each browser identity its own root,
# <notes_dir>/u-<subject>. That is the safe shape for a gateway, because one
# process serves N people and a NoteStore reads from disk, which has no
# identity: a shared root would hand every web user everyone else's notes.
#
# "workspace" reads the SHARED workspace-keyed tree the terminal TUI writes,
# <notes_dir>/ws-<id>. This exists for the common case that is NOT multi-user:
# one person, one machine, opening the same install through two frontends.
# Showing them an empty directory while their own notes sit one level up is a
# lost file, not isolation.
#
# It is opt-in and identity-BOUND, never inferred. Counting logged-in users is
# not a safe test for "only one person" — the first user can open the shared
# root before a second ever logs in — so workspace mode requires the subject
# below and REFUSES every other identity, before any session or note store is
# built for them.

# The single identity permitted in workspace mode. REQUIRED there: a missing
# value is a startup error, not a quiet fall back to per-user, because
# silently narrowing a mode the operator asked for is how a config mistake
# turns into a data-exposure surprise. Must match the daemon's own name for
# the user (what `auth.login` reports), not merely what gets typed in the
# browser form.
