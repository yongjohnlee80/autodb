# AutoDB as an AutoDoc plugin: AutoDoc's Plugins › Add from a git URL clones this repository,
# asks before it runs anything, then runs [install] build here and starts `command` from this
# directory. A card beside the page finds AutoDB (or installs its release), signs in, picks a
# connection, and runs the statement under the cursor, the selection or the whole note; the rows
# go to AutoDoc's own results table, a page at a time. The plugin is cmd/autodoc-autodb, a module
# of its own.
name     = "autodb"
title    = "AutoDB"
kind     = "dialog"
protocol = 6                   # card pointer actions; tables and typed cells remain compatible
command  = ["./bin/autodoc-autodb"]
calls    = ["buffer.new"]      # AutoDoc's command it runs: Enter on a table opens a SELECT of it

[dialog]
modal      = false             # a card: it takes the keys when focused, Esc gives them back
width      = 48
placements = ["right", "left"]

[feed]
document = true                # the note, and from protocol 4 each command carries it

[table]
title = "Results"

[[commands]]
id    = "toggle"
title = "Show or hide the AutoDB card"
key   = "o"

[[commands]]
id    = "run"
title = "Run statement or selection"
key   = "r"

[[commands]]
id    = "script"
title = "Run whole script"
key   = "s"                    # a command's key is one lower-case letter or digit

[[commands]]
id    = "connect"
title = "Connection…"
key   = "c"

[[commands]]
id    = "cancel"
title = "Cancel query"
key   = "x"

[install]
build = ["go", "-C", "cmd/autodoc-autodb", "run", "./build"]
