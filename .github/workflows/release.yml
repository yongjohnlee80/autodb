name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # Linux builds STATIC, the TUI alone: CGO_ENABLED=0, no `gui` tag. That is
    # the binary a server, a VM, a container or a Homebrew install on a
    # headless host runs, and it must start with nothing but the kernel. A
    # Linux "-gui" build adds --gui (golib/gui's native window): cgo, against
    # the window system's libraries, which it then NEEDS to run, so it is a
    # separate download, built natively on each architecture's runner. macOS
    # builds with cgo on a Mac and its one build carries the GUI; it needs only
    # macOS itself to run.
    #
    # v0.4.6 and v0.4.7 built every Linux binary with -tags gui, so the plain
    # linux-amd64 download linked libEGL, libwayland-client and libX11 and
    # would not start on a host without them ("error while loading shared
    # libraries: libEGL.so.1") -- caught by the Homebrew tap's ubuntu test.
    # The static check below keeps that from shipping again.
    #
    # Runner labels: macos-13 was retired 2025-12-04 and macos-14 follows
    # 2026-11-02, so Intel builds on macos-15-intel (the x86_64 label
    # GitHub's retirement notice names) and arm64 on macos-15.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64, runner: ubuntu-latest,    cgo: "0", tags: "",    suffix: "" }
          - { goos: linux,  goarch: arm64, runner: ubuntu-latest,    cgo: "0", tags: "",    suffix: "" }
          - { goos: linux,  goarch: amd64, runner: ubuntu-latest,    cgo: "1", tags: "gui", suffix: "-gui" }
          - { goos: linux,  goarch: arm64, runner: ubuntu-24.04-arm, cgo: "1", tags: "gui", suffix: "-gui" }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel,   cgo: "1", tags: "gui", suffix: "" }
          - { goos: darwin, goarch: arm64, runner: macos-15,         cgo: "1", tags: "gui", suffix: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: the window system's libraries (Linux GUI build)
        if: matrix.goos == 'linux' && matrix.tags == 'gui'
        # golib/gui's window libraries (Wayland/X11/Vulkan), per
        # golib/gui/README. libvulkan-dev carries the headers; there is no
        # vulkan-headers package on bookworm/trixie.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libvulkan-dev
      - name: build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT="autodb-${VERSION}-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          # -s -w: no symbol table or DWARF (about a third of the binary);
          # stack traces keep their function names. -trimpath keeps the
          # runner's paths out of the artefact. -tags gui only where the
          # matrix asks for the native window.
          go build -tags "${{ matrix.tags }}" -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}" -o "${OUT}" ./cmd/autodb
          # A plain Linux binary must be STATIC: it is the one a headless host
          # downloads. Asserted rather than assumed.
          if [ "${GOOS}" = "linux" ] && [ -z "${{ matrix.suffix }}" ]; then
            file "${OUT}"
            file "${OUT}" | grep -q "statically linked" || {
              echo "::error::${OUT} is not statically linked; the plain Linux download must start without the window libraries"
              exit 1
            }
          fi
          tar czf "${OUT}.tar.gz" "${OUT}"
          shasum -a 256 "${OUT}.tar.gz" > "${OUT}.tar.gz.sha256" # on Ubuntu and macOS alike
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: publish the release and attach the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        # CREATE-OR-UPLOAD, because `gh release create` FAILS OUTRIGHT when a
        # release for the tag already exists, and that is a reachable state
        # rather than an error:
        #
        #   - a maintainer wrote the release notes by hand before or just after
        #     pushing the tag, which is the ordinary way to publish notes that
        #     say more than --generate-notes can infer from commit subjects;
        #   - the tag was pushed, the run failed for an unrelated reason, and
        #     the retry finds its own half-finished release;
        #   - the publish job is re-run from the Actions UI.
        #
        # Measured on v0.3.10 (2026-09-10): the four build jobs all succeeded,
        # the release existed because it had been created by hand minutes
        # earlier, and this step died with "a release with the same tag name
        # already exists" — so the tag shipped with ZERO binaries while every
        # artifact sat complete on the run. The binaries are the only part of
        # this workflow a consumer cannot reproduce themselves, and they were
        # the only part it dropped.
        #
        # So: create when absent, and upload either way. --clobber makes a
        # re-run idempotent instead of failing on an asset that is already
        # there.
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; keeping its notes"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            --clobber

      - name: verify every artifact reached the release
        env:
          GH_TOKEN: ${{ github.token }}
        # THE STEP ABOVE CAN SUCCEED HAVING UPLOADED NOTHING, which is how this
        # failure stayed invisible until someone looked at the release page. An
        # upload of a glob that matched no files, or a partial upload, both exit
        # 0. So the count is asserted: one tarball and one checksum per platform
        # the build matrix produced.
        run: |
          set -euo pipefail
          want=$(ls -1 dist/*.tar.gz dist/*.tar.gz.sha256 | wc -l)
          got=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')
          echo "artifacts built: ${want}; assets on the release: ${got}"
          if [ "${got}" -lt "${want}" ]; then
            echo "::error::${got} assets on ${GITHUB_REF_NAME} but ${want} were built — the release is incomplete"
            exit 1
          fi
