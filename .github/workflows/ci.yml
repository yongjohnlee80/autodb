name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # Formatting first: it is the cheapest gate and the one whose absence is
      # invisible until a diff is noisy. Committed drift in
      # core/config/config_test.go survived precisely because nothing checked.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # -race because the RPC session pool, the web gateway and the TUI all run
      # concurrently, and a data race that only shows up under load is a race that
      # ships. -count=2 because a suite run once is a suite whose flakes are
      # someone else's problem later; the whole suite takes ~17s this way.
      - name: test
        run: go test -race -count=2 ./...
      - name: static cross-build smoke
        run: |
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/autodb
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/autodb

  # The neovim smoke suite. A separate job because it needs neovim and the
  # auto-core.nvim plugin, and because it was in NEITHER the Makefile nor CI —
  # so its 45 real-daemon/UI assertions, including the handshake and
  # identity-refusal security boundary, had no automated signal at all.
  lua:
    runs-on: ubuntu-latest
    env:
      # Bump deliberately alongside a compatibility check; a scheduled canary can
      # track auto-core's HEAD separately.
      #
      # 9c44a56 == auto-core v0.2.2, the release that carries ui.float.viewer,
      # Model:row_entries and grid.row_detail_lines (ADR-0066). This bump is not
      # optional: autodb.results requires auto-core.ui.float.viewer at MODULE
      # top level, so against the previous pin the module failed to load at all
      # and the suite aborted before its SMOKE-COMPLETE sentinel.
      AUTO_CORE_SHA: "9c44a5621887515e8e2df24d4c6d05da749a72e6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: install neovim
        env:
          # Pinned to v0.12.2 — the version the suite's 213 assertions were verified
          # against locally — not 'stable', a moving target that makes a blocking
          # gate non-reproducible. Bump deliberately, after a canary proves the new
          # one. The SHA-256 is the REAL pin: a GitHub release asset can be replaced
          # under the same tag/name, so the version tag alone is not reproducible
          # (lector r2). Recompute it when bumping the version.
          NVIM_VERSION: "v0.12.2"
          NVIM_SHA256: "31cf85945cb600d96cdf69f88bc68bec814acbff50863c5546adef3a1bcef260"
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: fetch auto-core.nvim (hard dependency of the suite)
        run: |
          # The suite probes stdpath('data')/lazy/auto-core.nvim; put it there.
          dest="$HOME/.local/share/nvim/lazy/auto-core.nvim"
          mkdir -p "$(dirname "$dest")"
          # Pinned to a commit for a deterministic blocking gate. Latest-auto-core
          # compatibility belongs in a separate scheduled canary, not here.
          git clone https://github.com/yongjohnlee80/auto-core.nvim "$dest"
          git -C "$dest" checkout "$AUTO_CORE_SHA"
      - name: test suites
        run: ./tests/run-all.sh
