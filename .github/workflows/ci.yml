name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The cheap gates and the compile smokes, once. They used to run in front of
  # the whole suite on one runner; split out, they finish while the shards run.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # Formatting first: it is the cheapest gate and the one whose absence is
      # invisible until a diff is noisy. Committed drift in
      # core/config/config_test.go survived precisely because nothing checked.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # A shard naming a package that no longer exists would pass while
      # testing nothing; this fails the build instead.
      - name: test shards name real packages
        run: .github/ci/test-shard.sh --check
      - name: static cross-build smoke
        run: |
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/autodb
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/autodb
      - name: gui-tagged test compile smoke
        # --gui's build-tagged half (cmd/autodb/gui.go) links golib/gui, so it
        # needs cgo and the window headers; vet still compiles both halves,
        # which is what this job can and does check on a runner without a
        # display.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev \
            libvulkan-dev
          go vet -tags gui ./cmd/...

  # THE SUITE, SHARDED. One job ran every package in about 13 minutes;
  # .github/ci/test-shard.sh splits it by measured time, so each shard is
  # bounded by its slowest package, and a flake re-runs only its own shard
  # ("Re-run failed jobs"). "rest" is every package no named shard claims,
  # computed, so a new package cannot fall out of CI.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [tui, frontdoor, exec, cmd-auth, guards, rest]
    steps:
      - uses: actions/checkout@v4
        with:
          # THE RELEASE HISTORY IS TEST INPUT HERE, not decoration. The
          # upgrade-path cells construct a host provisioned at a tag predating
          # exec.max_target_conns by running THAT TAG'S OWN installer, which
          # needs the tags and their trees. The default depth-1 checkout fetches
          # neither, and those cells would skip -- so SCRIPTGUARD_REQUIRE_GITTAGS
          # below turns removing this line into a failing build rather than a
          # silent loss of the only coverage the upgrade transition has.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # -race because the RPC session pool, the web gateway and the TUI all run
      # concurrently, and a data race that only shows up under load is a race that
      # ships. -count=2 because a suite run once is a suite whose flakes are
      # someone else's problem later.
      - name: test
        # DECLARE WHAT THIS RUNNER CAN DO. internal/scriptguard has cells that
        # need a usable container runtime, setsid(1), script(1) or an
        # unprivileged euid, and each of them SKIPS when the host cannot supply
        # it. On a laptop that is right. Here it is wrong, and until now nothing
        # could tell the two apart: this step has no -v, so a cell that ran and
        # a cell that skipped produced byte-identical output and only a failure
        # was ever visible. Trying to confirm the --apply container cell runs
        # here (2026-09-23) turned up nothing better than elapsed time.
        #
        # Each variable turns that capability's skip into a FAILURE, so the
        # coverage this workflow is trusted for is now gated rather than
        # assumed. Every name is checked against the package's vocabulary by
        # TestCapabilityGate_EveryDeclaredRequirementNamesAKnownCapability -- a
        # typo here would otherwise be a gate that silently does nothing.
        #
        # root is deliberately absent: the runner is not root, so
        # TestTargetBudget_OmissionLeavesAnExistingConfigAndWritesNoBackup still
        # skips here and says so. Its ordering is covered as root inside the
        # container the apply smoke starts -- which is exactly the cell the
        # docker requirement above now guarantees runs.
        env:
          SCRIPTGUARD_REQUIRE_DOCKER: "1"
          SCRIPTGUARD_REQUIRE_GITTAGS: "1"
          SCRIPTGUARD_REQUIRE_SETSID: "1"
          SCRIPTGUARD_REQUIRE_SCRIPT: "1"
          SCRIPTGUARD_REQUIRE_UNPRIVILEGED: "1"
        run: |
          pkgs=$(.github/ci/test-shard.sh "${{ matrix.shard }}")
          echo "$pkgs"
          go test -race -count=2 $pkgs

  # macOS SERVES. Every darwin release before v0.4.4 refused its own --serve
  # (the lease flocked meta.db, which darwin refuses while SQLite holds fcntl
  # locks on it), and nothing caught it: CI ran on linux only, and the tap's
  # macOS check runs `autodb --version`, which never starts a server. This job
  # runs the real binary on a Mac: --serve answers on its socket and runs a
  # query; two processes whose $TMPDIR differ (a shell, tmux, a GUI launch)
  # meet over one store, and the second --serve's refusal names the holder's
  # socket and pid; a spawned server that refuses is reported in its own
  # words. Plus the lease and lease-record cells that hold the darwin fix.
  #
  # THE NAMED CELLS MUST HAVE RUN AND PASSED. A -run pattern that matches
  # nothing, or a cell that skips, exits 0; the last step fails on either.
  macos:
    name: macos (serve)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go build ./...
      - name: serve, dial, query; the two-context split; the refusal report
        run: |
          # Every package runs even when one fails, so one run shows them all.
          set -o pipefail
          status=0
          go test -count=1 -v -run '^(TestServe_|TestWebUI_ACancelledContext|TestDiscovery_|TestSpawn_|TestSpawnFor_StartsThisExecutable|TestStartLogged_|TestReadSpawnReport_|TestSweepSpawnReports_|TestSpawnReport_|TestServeLogPath)' ./app/ | tee macos-app.log || status=1
          go test -count=1 -v -run '^(TestInstanceLease_|TestLeaseRecord_|TestStoreID_)' ./core/meta/ | tee macos-meta.log || status=1
          go test -count=1 -v -run '^(TestLocate_|TestProbeHello_)' ./rpc/ | tee macos-rpc.log || status=1
          go test -count=1 -v -run '^TestSession_' ./tui/ | tee macos-tui.log || status=1
          exit $status
      - name: the darwin cells ran and passed
        if: always()
        run: |
          fail=0
          for cell in \
            TestServe_ADaemonRunsAQueryOverItsSocket \
            TestDiscovery_ASecondServeOnAnotherSocketNamesTheHolder \
            TestDiscovery_PrintEndpointAnswersTheHolderAndItsStore \
            TestSpawn_ARefusedServeIsReportedAtOnceAndNamesTheHolder \
            TestSpawn_AServingChildWithdrawsItsReport \
            TestStartLogged_ConcurrentSpawnsReportOnlyTheirOwnChild \
            TestInstanceLease_AcquiresOverAnOpenStore \
            TestInstanceLease_SecondProcessIsRefused \
            TestLeaseRecord_AcquireAnnounceRelease \
            TestSession_ASpawnedServerThatExitsIsReportedInItsOwnWords; do
            if ! grep -q -- "--- PASS: $cell " macos-*.log; then
              echo "::error::$cell did not run and pass on macOS"
              fail=1
            fi
          done
          exit $fail

  # The neovim smoke suite. A separate job because it needs neovim and the
  # auto-core.nvim plugin, and because it was in NEITHER the Makefile nor CI —
  # so its 45 real-daemon/UI assertions, including the handshake and
  # identity-refusal security boundary, had no automated signal at all.
  lua:
    runs-on: ubuntu-latest
    env:
      # Bump deliberately alongside a compatibility check; a scheduled canary can
      # track auto-core's HEAD separately.
      #
      # 9c44a56 == auto-core v0.2.2, the release that carries ui.float.viewer,
      # Model:row_entries and grid.row_detail_lines (ADR-0066). This bump is not
      # optional: autodb.results requires auto-core.ui.float.viewer at MODULE
      # top level, so against the previous pin the module failed to load at all
      # and the suite aborted before its SMOKE-COMPLETE sentinel.
      AUTO_CORE_SHA: "9c44a5621887515e8e2df24d4c6d05da749a72e6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: install neovim
        env:
          # Pinned to v0.12.2 — the version the suite's 213 assertions were verified
          # against locally — not 'stable', a moving target that makes a blocking
          # gate non-reproducible. Bump deliberately, after a canary proves the new
          # one. The SHA-256 is the REAL pin: a GitHub release asset can be replaced
          # under the same tag/name, so the version tag alone is not reproducible
          # (lector r2). Recompute it when bumping the version.
          NVIM_VERSION: "v0.12.2"
          NVIM_SHA256: "31cf85945cb600d96cdf69f88bc68bec814acbff50863c5546adef3a1bcef260"
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_SHA256  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: fetch auto-core.nvim (hard dependency of the suite)
        run: |
          # The suite probes stdpath('data')/lazy/auto-core.nvim; put it there.
          dest="$HOME/.local/share/nvim/lazy/auto-core.nvim"
          mkdir -p "$(dirname "$dest")"
          # Pinned to a commit for a deterministic blocking gate. Latest-auto-core
          # compatibility belongs in a separate scheduled canary, not here.
          git clone https://github.com/yongjohnlee80/auto-core.nvim "$dest"
          git -C "$dest" checkout "$AUTO_CORE_SHA"
      - name: test suites
        run: ./tests/run-all.sh
